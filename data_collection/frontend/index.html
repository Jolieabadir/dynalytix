<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!--
      viewport-fit=cover lets the layout run under the notch and home
      indicator; App.css pays that back with safe-area padding.
      maximum-scale is deliberately NOT set: pinch-zoom is pinned off only
      inside the video overlay, never for the whole page, because disabling
      it site-wide breaks the app for anyone who needs to zoom text.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12151a" />

    <!-- PWA: installed from the Home Screen this runs fullscreen, which also
         survives an app switch a little better than a Safari tab. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dynalytix" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Dynalytix · Climbing Movement Labeling</title>
    <meta name="description" content="Dynalytix research platform: label climbing movement video frame by frame, aligned to pose data." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
